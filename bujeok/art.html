<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부적난무 그림 갤러리</title>
<style>
/* Hallmark · component: dev sprite gallery · genre: utilitarian · theme: game palette (dark earth) */
:root {
  --color-paper: #2a2820;
  --color-ink: #e9e1d2;
  --color-muted: #a39985;
  --color-rule: #3d3a2e;
  --font-body: ui-monospace, Menlo, monospace;
  --space-sm: 8px; --space-md: 16px; --space-lg: 32px;
}
html, body { overflow-x: clip; }
body { margin: 0; padding: var(--space-md); background: var(--color-paper); color: var(--color-ink); font: 13px/1.4 var(--font-body); }
h1, h2 { font-style: normal; font-weight: 600; margin: 0 0 var(--space-sm); font-size: 14px; }
h2 { color: var(--color-muted); }
section { border-top: 1px solid var(--color-rule); padding: var(--space-md) 0; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-lg); align-items: flex-end; }
.crowd { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
figure { margin: 0; display: flex; flex-direction: column; gap: var(--space-sm); }
figure .frames { display: flex; gap: var(--space-md); align-items: flex-end; }
figcaption { color: var(--color-muted); }
canvas { image-rendering: pixelated; display: block; }
.icons { display: flex; gap: var(--space-sm); overflow-x: auto; padding-bottom: var(--space-sm); }
</style>
</head>
<body>
<h1>부적난무 그림 갤러리 (개발용)</h1>
<section>
  <h2>게임 배율 1.5×</h2>
  <div class="crowd" id="crowd"></div>
</section>
<section>
  <h2>부적 아이콘 6× · 한 줄(기본 12 · 합체 12)</h2>
  <div class="icons" id="icons"></div>
</section>
<section>
  <h2>6× · 1프레임 · 2프레임 · 번쩍임</h2>
  <div class="row" id="big"></div>
</section>
<script src="art/palette.js?v=17"></script>
<script src="art/heroes.js?v=17"></script>
<script src="art/enemies.js?v=17"></script>
<script src="art/world.js?v=17"></script>
<script src="art/icons.js?v=17"></script>
<script src="art/index.js?v=17"></script>
<script>
(function gallery() {
  // 그림 한 장을 배율 z로 그린 캔버스. white면 테두리 k만 남기고 흰색
  function paint(f, z, white) {
    const cv = document.createElement('canvas'), h = f.length, w = f[0].length;
    cv.width = Math.round(w * z); cv.height = Math.round(h * z);
    const cx = cv.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = f[y][x];
      if (ch === '.') continue;
      cx.fillStyle = '#' + (white && ch !== 'k' ? 0xffffff : BJ_ART.PAL[ch]).toString(16).padStart(6, '0');
      cx.fillRect(Math.round(x * z), Math.round(y * z), Math.round((x + 1) * z) - Math.round(x * z), Math.round((y + 1) * z) - Math.round(y * z));
    }
    return cv;
  }
  const errs = BJ_ART.check(BJ_ART);
  if (errs.length) { const p = document.createElement('pre'); p.textContent = errs.join('\n'); document.body.prepend(p); }
  const crowd = document.getElementById('crowd'), big = document.getElementById('big'), icons = document.getElementById('icons');
  for (const id of Object.keys(BJ_ART.sprites).filter(k => k.startsWith('i:'))) {
    const cv = paint(BJ_ART.sprites[id].frames[0], 6);
    cv.title = id;
    icons.appendChild(cv);
  }
  for (const [id, s] of Object.entries(BJ_ART.sprites)) {
    for (let i = 0; i < 3; i++) crowd.appendChild(paint(s.frames[i % s.frames.length], BJ_ART.SCALE));
    const fig = document.createElement('figure'), frames = document.createElement('div'), cap = document.createElement('figcaption');
    frames.className = 'frames';
    frames.append(paint(s.frames[0], 6), paint(s.frames[1 % s.frames.length], 6), paint(s.frames[0], 6, true));
    cap.textContent = id + (s.float ? ' · float' : '');
    fig.append(frames, cap);
    big.appendChild(fig);
  }
})();
</script>
</body>
</html>
