<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2026">
<link rel="icon" href="data:,">
<title>붕붕이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V3 · redesign v3: visibility for beginner on phone landscape
 * Hallmark · game HUD (no macrostructure: in-game overlay) · tone: utilitarian instrument panel
 * anchor hue: 250 (cool slate) · accent: parking-line amber oklch(84% 0.15 88) · genre: modern-minimal
 * fonts: IBM Plex Sans KR (UI) + IBM Plex Mono (instrument numbers, tabular)
 * states: default · hover · focus-visible · active · pressed · selected
 */
:root {
  --color-paper: oklch(17% 0.012 250);
  --color-panel: oklch(15% 0.012 250 / 0.9);
  --color-panel-solid: oklch(21% 0.012 250);
  --color-raised: oklch(27% 0.014 250);
  --color-raised-2: oklch(33% 0.014 250);
  --color-rule: oklch(46% 0.012 250);
  --color-ink: oklch(95% 0.008 90);
  --color-muted: oklch(82% 0.012 250);
  --color-faint: oklch(66% 0.012 250);
  --color-accent: oklch(84% 0.15 88);
  --color-accent-ink: oklch(22% 0.03 88);
  --color-danger: oklch(66% 0.2 28);
  --color-danger-deep: oklch(30% 0.09 28 / 0.92);
  --color-ok-deep: oklch(30% 0.07 155 / 0.92);
  --color-ok: oklch(78% 0.15 155);
  --color-focus: oklch(84% 0.15 88);
  --color-scrim: oklch(12% 0.01 250 / 0.72);
  --color-scrim-strong: oklch(15% 0.012 250 / 0.9);
  --color-shadow: oklch(8% 0.01 250 / 0.6);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --text-xs: 13px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px; --text-xl: 28px; --text-display: 44px;
  --radius: 6px; --radius-lg: 10px;
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms; --dur-med: 220ms;
  --safe-t: max(var(--space-3), env(safe-area-inset-top));
  --safe-r: max(var(--space-3), env(safe-area-inset-right));
  --safe-b: max(var(--space-3), env(safe-area-inset-bottom));
  --safe-l: max(var(--space-3), env(safe-area-inset-left));
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overflow-x: clip; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.45; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ── HUD ── */
.hud { position: fixed; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.panel { background: var(--color-panel); border: 1px solid var(--color-rule); border-radius: var(--radius); }
.info { position: absolute; top: var(--safe-t); left: var(--safe-l); max-width: min(360px, 31vw); padding: var(--space-2) var(--space-3); pointer-events: none; }
.info-map { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info-goal { font-size: var(--text-lg); font-weight: 700; margin-top: 2px; line-height: 1.3; }
.info-tip { font-size: var(--text-sm); color: var(--color-muted); margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--color-rule); }
.status { position: absolute; top: var(--safe-t); right: var(--safe-r); display: flex; gap: var(--space-2); align-items: stretch; }
.stats { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3); height: 48px; font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; }
.stats b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--color-ink); margin-left: var(--space-1); }
.stats .is-hot b { color: var(--color-danger); }
body.touch .st-extra { display: none; }
.icon-btn { height: 48px; min-width: 60px; padding: 0 var(--space-3); border-radius: var(--radius); border: 1px solid var(--color-rule); background: var(--color-panel); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out); }
.icon-btn:hover { background: var(--color-raised); }
.icon-btn:active { background: var(--color-raised-2); transform: translateY(1px); }

.cluster { position: absolute; left: 50%; bottom: var(--safe-b); transform: translateX(-50%); display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-4); white-space: nowrap; pointer-events: none; }
.gears { display: flex; gap: 2px; font-family: var(--font-num); font-weight: 700; font-size: 24px; }
.gears span { width: 28px; text-align: center; color: var(--color-faint); border-bottom: 3px solid transparent; }
.gears span.is-on { color: var(--color-accent); border-bottom-color: var(--color-accent); }
.speed { display: flex; align-items: baseline; gap: var(--space-1); }
.speed .num { font-size: var(--text-xl); font-weight: 700; min-width: 2ch; text-align: right; }
.speed small, .steer small { font-size: var(--text-xs); color: var(--color-muted); }
.steer { display: flex; align-items: center; gap: var(--space-2); }
.steer svg { width: 28px; height: 28px; display: block; }
.steer .num { font-size: 24px; font-weight: 700; min-width: 4.2ch; text-align: right; }
.sep { width: 1px; align-self: stretch; background: var(--color-rule); }

.sensors { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 70px); transform: translateX(-50%); display: flex; gap: var(--space-2); pointer-events: none; }
.sensor { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); font-size: var(--text-md); font-weight: 600; }
.sensor-bar { width: 72px; height: 6px; border-radius: 3px; background: var(--color-raised); overflow: hidden; }
.sensor-bar i { display: block; height: 100%; width: 0; background: var(--color-muted); }
.sensor.is-mid .sensor-bar i { background: var(--color-accent); }
.sensor.is-near .sensor-bar i { background: var(--color-danger); }
.sensor.is-near .num { color: var(--color-danger); }
.incline { position: absolute; left: 50%; top: var(--safe-t); transform: translateX(-50%); display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); border-color: var(--color-accent); color: var(--color-accent); font-size: var(--text-lg); pointer-events: none; }
.incline svg { width: 36px; height: 22px; display: block; overflow: visible; }
.incline b { color: var(--color-ink); font-weight: 700; }
.notice { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); padding: var(--space-3) var(--space-5); font-size: var(--text-lg); font-weight: 700; white-space: nowrap; pointer-events: none; background: var(--color-panel-solid); border: 2px solid var(--color-accent); color: var(--color-ink); }
.keys { background: var(--color-panel); border-radius: var(--radius); position: absolute; left: var(--safe-l); bottom: var(--safe-b); font-size: var(--text-xs); color: var(--color-muted); padding: var(--space-1) var(--space-2); pointer-events: none; max-width: calc(50vw - 320px); }
@media (max-width: 1100px) { .keys { display: none; } }
body.touch .t-hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 164px); width: max-content; max-width: min(340px, 44vw); /* 가운데, 깜빡이 줄 위: 사이드미러·버튼을 가리지 않게 */ padding: var(--space-2) var(--space-3); font-size: var(--text-sm); font-weight: 700; line-height: 1.4; pointer-events: none; background: var(--color-panel-solid); border: 2px solid var(--color-accent); color: var(--color-ink); }
body:not(.touch) .t-hint { display: none; }
body.touch .keys { display: none; }

/* ── 터치 조작: 왼쪽 핸들 / 오른쪽 기어 줄 + 페달 (모든 목표 ≥ 48px) ── */
.touch-only { display: none; }
body.touch .touch-only { display: flex; }
.t-wheel { position: absolute; left: var(--safe-l); bottom: var(--safe-b); width: 140px; height: 140px; border-radius: 50%; touch-action: none; }
.t-wheel svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1px 2px var(--color-shadow)); }
.t-right { position: absolute; right: var(--safe-r); bottom: var(--safe-b); width: 196px; flex-direction: column; gap: var(--space-2); }
body.touch .t-gears { position: absolute; left: calc(var(--safe-l) + 156px); bottom: var(--safe-b); display: grid; grid-template-columns: repeat(2, 50px); gap: 6px; }
.t-gears button { height: 46px; border-radius: var(--radius); border: 1px solid var(--color-rule); background: var(--color-panel); font-family: var(--font-num); font-weight: 700; font-size: var(--text-lg); }
.t-gears button.is-on { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); }
.t-gears button:active { background: var(--color-raised-2); }
.t-pedals { display: flex; gap: var(--space-2); }
.pedal { position: relative; overflow: hidden; height: 132px; border-radius: var(--radius-lg); border: 2px solid var(--pedal-color); background: var(--pedal-bg); display: flex; align-items: flex-end; justify-content: center; padding-bottom: var(--space-2); font-size: var(--text-md); font-weight: 700; color: var(--color-ink); touch-action: none; background-image: repeating-linear-gradient(0deg, transparent 0 12px, var(--color-rule) 12px 14px); background-size: 56% 62%; background-repeat: no-repeat; background-position: center 10px; }
.pedal.is-pressed { border-color: var(--color-ink); }
.pedal > span { position: relative; pointer-events: none; }
.pedal-fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--depth, 0%); background: var(--pedal-color); opacity: 0.55; pointer-events: none; }
.pedal-brake { flex: 1.3; --pedal-color: var(--color-danger); --pedal-bg: var(--color-danger-deep); }
.pedal-gas { flex: 1; --pedal-color: var(--color-ok); --pedal-bg: var(--color-ok-deep); }
.pdepth { display: flex; flex-direction: column; gap: 3px; }
.pdepth-row { display: flex; align-items: center; gap: var(--space-2); justify-content: space-between; }
.pdepth small { font-size: var(--text-xs); color: var(--color-muted); }
.pdepth-bar { width: 64px; height: 8px; border-radius: 4px; background: var(--color-raised); overflow: hidden; }
.pdepth-bar i { display: block; height: 100%; width: 0; }
.pdepth-bar.is-brake i { background: var(--color-danger); }
.pdepth-bar.is-gas i { background: var(--color-ok); }
/* 휴대폰: 계기판·센서는 핸들과 페달 사이 빈 칸 가운데. 페달 깊이는 페달 안 채움으로 보이므로 계기판 막대는 숨김 */
body.touch .cluster, body.touch .sensors { left: calc(var(--safe-l) + 274px); right: calc(var(--safe-r) + 206px); transform: none; width: max-content; margin: 0 auto; }
body.touch .cluster .gears, body.touch .cluster .gears + .sep { display: none; } /* 기어 버튼이 현재 기어를 보여 줌 */
body.touch .cluster { gap: var(--space-3); padding: var(--space-2) var(--space-3); }
body.touch .pdepth, body.touch .pdepth-sep, body.touch #steer-dir { display: none; }
body.touch .info { max-width: min(300px, 34vw); }
body.touch .info-goal { font-size: 15px; }
/* 좁은 가로 휴대폰: 센서 두 줄로 쌓아 페달과 겹치지 않게 */
@media (max-width: 900px) {
  body.touch .sensors { flex-direction: column; align-items: center; gap: var(--space-1); }
  body.touch .sensor { padding: 2px var(--space-2); font-size: var(--text-sm); }
  body.touch .sensor-bar { width: 40px; }
}
/* 더 좁으면 핸들 각도 숫자는 숨김: 핸들 그림이 각도를 보여 줌 */
@media (max-width: 760px) {
  body.touch .cluster { gap: var(--space-2); padding: var(--space-1) var(--space-2); }
  body.touch .cluster .steer .num { display: none; }
}

/* 시야 확보: 가로 휴대폰 팁을 짧게 접고, 조작부와 정보가 겹치지 않도록 한다. */
@media (max-height: 500px) {
  .info-tip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info-goal { font-size: var(--text-sm); }
  .info { max-width: min(300px, 36vw); }
}
/* ── 오버레이 공통 ── */
.overlay { position: fixed; inset: 0; background: var(--color-scrim); display: flex; }
.btn { height: 44px; padding: 0 var(--space-5); border-radius: var(--radius); border: 1px solid var(--color-rule); background: var(--color-raised); font-weight: 600; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.btn:hover { background: var(--color-raised-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); }
.btn-primary:hover { background: var(--color-ink); border-color: var(--color-ink); }

/* ── 메뉴 ── */
.menu { flex-direction: column; background: var(--color-scrim-strong); padding: var(--safe-t) var(--safe-r) 0 var(--safe-l); }
.menu-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-2) 0; flex-wrap: wrap; }
.menu-title { font-size: var(--text-xl); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.menu-sub { color: var(--color-muted); font-size: var(--text-sm); margin: 0; flex: 1; min-width: 0; }
.tabs { display: flex; gap: var(--space-1); padding: var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--color-rule); overflow-x: auto; scrollbar-width: none; }
.tab { height: 44px; padding: 0 var(--space-4); border: 0; border-bottom: 2px solid transparent; background: none; color: var(--color-muted); font-weight: 600; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--color-ink); }
.tab[aria-selected="true"] { color: var(--color-ink); border-bottom-color: var(--color-accent); }
.tab .num { font-weight: 500; color: var(--color-faint); margin-left: var(--space-1); font-size: var(--text-sm); }
.cards { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; padding: var(--space-4) var(--space-2); display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: var(--space-3); align-content: start; }
.card { text-align: left; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); border-radius: var(--radius-lg); border: 1px solid var(--color-rule); background: var(--color-panel-solid); min-width: 0; transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.card:hover { border-color: var(--color-accent); background: var(--color-raised); }
.card:active { transform: translateY(1px); }
.card-name { font-weight: 600; font-size: var(--text-md); }
.card-tip { font-size: var(--text-sm); color: var(--color-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-faint); margin-top: auto; padding-top: var(--space-2); border-top: 1px solid var(--color-rule); }
.card-foot .rec { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--color-muted); white-space: nowrap; }
.card-foot .rec.is-none { font-family: var(--font-body); color: var(--color-faint); }
.menu-foot { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-2) var(--safe-b); border-top: 1px solid var(--color-rule); font-size: var(--text-sm); color: var(--color-muted); flex-wrap: wrap; }
.spec { flex: 1 1 220px; min-width: 0; } /* 좁은 세로 화면: 한 줄을 다 쓰고 음성·효과음은 아래 줄로 */
.vol { display: flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.vol input { width: 120px; height: 44px; margin: 0; accent-color: var(--color-accent); touch-action: none; } /* 손가락 닿는 높이 */

/* ── 결과 ── */
.result { align-items: center; justify-content: center; padding: var(--space-4); }
.result-card { display: flex; flex-direction: column; width: min(440px, 100%); padding: var(--space-6); border-radius: var(--radius-lg); background: var(--color-panel-solid); border: 1px solid var(--color-rule); box-shadow: 0 20px 60px var(--color-shadow); }
.result-map { font-size: var(--text-sm); color: var(--color-muted); margin: 0; }
.result-grade { font-size: var(--text-display); font-weight: 700; margin: 0; line-height: 1.1; letter-spacing: -0.02em; }
.result-grade.is-perfect { color: var(--color-accent); }
.result-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); margin: var(--space-4) 0 var(--space-3); }
.result-stats div { padding: var(--space-2) var(--space-3); border-radius: var(--radius); background: var(--color-raised); }
.result-stats dt { font-size: var(--text-xs); color: var(--color-muted); }
.result-stats dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--text-lg); font-weight: 600; }
.result-best { font-size: var(--text-sm); color: var(--color-muted); margin: 0 0 var(--space-5); }
.result-best.is-new { color: var(--color-ok); font-weight: 600; }
.result-actions { display: flex; gap: var(--space-2); }
.result-actions .btn { flex: 1; padding: 0 var(--space-3); }

.rotate { position: fixed; inset: 0; background: var(--color-paper); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--space-6); font-size: var(--text-lg); font-weight: 600; }
.rotate small { display: block; font-size: var(--text-sm); font-weight: 400; color: var(--color-muted); margin-top: var(--space-2); }
.rotate .btn { margin-top: var(--space-5); }
@media (orientation: portrait) and (max-width: 600px) { body.touch:not(.rotate-skip) .rotate { display: flex; } } /* 휴대폰만: 태블릿 세로는 그대로 */

@media (max-height: 480px) {
  .result-card { padding: var(--space-4); }
  .result-grade { font-size: 34px; }
  .result-stats { margin: var(--space-2) 0; }
  .result-best { margin-bottom: var(--space-3); }
  .cards { padding-top: var(--space-3); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; }
}
</style>

<body>
<canvas id="view"></canvas>

<div class="hud" id="hud" hidden>
  <section class="nav-panel panel city-only" aria-label="주행 안내">
    <span class="nav-arrow" id="nav-arrow" aria-hidden="true">↑</span>
    <div><div class="nav-distance" id="nav-distance"></div><div class="nav-turn" id="nav-turn"></div></div>
    <div class="nav-lanes" id="nav-lanes" aria-label="이용할 차로"></div>
  </section>
  <figure class="nav-map panel city-only" style="margin:0"><canvas id="nav-map" width="240" height="180" aria-label="진행 방향 기준 경로 지도"></canvas><figcaption>진행 방향 ↑</figcaption></figure>
  <div class="nav-limit city-only" id="nav-limit" aria-label="제한속도"></div>
  <div class="nav-camera panel city-only" id="nav-camera" hidden></div>
  <div class="drive-toast panel" id="drive-toast" role="status" hidden></div>
  <div class="blink-controls city-only" aria-label="방향지시등">
    <button id="blink-left" data-blink="-1" aria-label="왼쪽 깜빡이" aria-pressed="false"><span aria-hidden="true">◀</span><small>좌측</small></button>
    <button id="blink-right" data-blink="1" aria-label="오른쪽 깜빡이" aria-pressed="false"><span aria-hidden="true">▶</span><small>우측</small></button>
    <button id="hazard" data-hazard aria-label="비상등" aria-pressed="false"><span aria-hidden="true">⚠</span><small>비상등</small></button>
  </div>
  <button class="mirror-hit" id="mirror-left" data-mirror="left" aria-label="왼쪽 미러 확인" hidden><span>왼쪽 미러</span></button>
  <button class="mirror-hit" id="mirror-right" data-mirror="right" aria-label="오른쪽 미러 확인" hidden><span>오른쪽 미러</span></button>
  <div class="info panel">
    <div class="info-map" id="hud-map"></div>
    <div class="info-goal" id="hud-goal"></div>
    <div class="info-tip" id="hud-tip"></div>
  </div>
  <div class="status">
    <div class="stats panel">
      <span id="st-contacts">접촉<b>0</b></span>
      <span class="st-extra">전환<b id="st-switches">0</b></span>
      <span class="st-extra">시간<b id="st-time">0:00</b></span>
    </div>
    <button class="icon-btn" data-pp="view" id="btn-view" aria-label="시점 바꾸기">운전석</button>
    <button class="icon-btn" data-pp="menu" aria-label="메뉴 열기">메뉴</button>
  </div>
  <div class="sensors">
    <div class="sensor panel" id="sn-front" hidden><span>앞</span><span class="sensor-bar"><i></i></span><span class="num"></span></div>
    <div class="sensor panel" id="sn-rear" hidden><span>뒤</span><span class="sensor-bar"><i></i></span><span class="num"></span></div>
  </div>
  <div class="incline panel" id="incline" hidden>
    <svg viewBox="-16 -10 32 20" aria-hidden="true"><g id="incline-icon"><path d="M-14 4h28" stroke="currentColor" stroke-width="2.5"/><rect x="-9" y="-3" width="16" height="6" rx="1.5" fill="currentColor"/><path d="M7 -1h6l-2 -2m2 2l-2 2" stroke="currentColor" stroke-width="1.6" fill="none"/></g></svg>
    <b id="incline-txt"></b>
  </div>
  <div class="notice panel" id="notice" role="status" hidden>정지 후 변경 — 브레이크를 밟으세요</div>
  <div class="notice panel lesson-toast" id="lesson-toast" role="status" hidden></div>
  <div class="t-hint panel" id="touch-hint" role="status" hidden></div>
  <div class="cluster panel">
    <div class="gears" id="gears"><span>P</span><span>R</span><span>N</span><span>D</span></div>
    <span class="sep"></span>
    <div class="speed"><span class="num" id="speed">0</span><small>km/h</small></div>
    <span class="sep"></span>
    <div class="pdepth" aria-label="페달 깊이">
      <span class="pdepth-row"><small>브레이크</small><span class="pdepth-bar is-brake"><i id="pd-brake"></i></span></span>
      <span class="pdepth-row"><small>엑셀</small><span class="pdepth-bar is-gas"><i id="pd-gas"></i></span></span>
    </div>
    <span class="sep pdepth-sep"></span>
    <div class="steer">
      <svg viewBox="-16 -16 32 32" aria-hidden="true"><g id="steer-icon" fill="none" stroke="currentColor" stroke-width="2.4"><circle r="13"/><path d="M-13 0h26M0 0v13"/><circle r="3" fill="currentColor" stroke="none"/></g></svg>
      <span class="num" id="steer-deg">0°</span><small id="steer-dir">가운데</small>
    </div>
  </div>
  <div class="keys">←→ 핸들 · Q/E 미러 · Z/C 깜빡이 · X 비상등 · ↑ 엑셀 · ↓ 브레이크(누르고 있으면 점점 깊게) · P R N D 기어 · V 시점 · Esc 메뉴</div>

  <div class="t-wheel touch-only" data-pp="wheel" aria-label="핸들">
    <svg viewBox="-80 -80 160 160" aria-hidden="true">
      <g id="t-wheel-g">
        <circle r="70" fill="none" style="stroke: var(--color-shadow)" stroke-width="18"/>
        <circle r="70" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="12"/>
        <path d="M-64 6 L-14 14 L0 64 L14 14 L64 6" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="10" stroke-linejoin="round"/>
        <circle r="16" fill="currentColor" fill-opacity="0.75"/>
        <rect x="-4" y="-76" width="8" height="14" rx="2" fill="var(--color-accent)"/>
      </g>
    </svg>
  </div>
  <!-- 기어는 핸들 옆: 오른손으로 브레이크를 누른 채 왼손으로 바꾼다 -->
  <div class="t-gears touch-only" id="t-gears" aria-label="기어">
    <button data-gear="P">P</button><button data-gear="R">R</button><button data-gear="N">N</button><button data-gear="D">D</button>
  </div>
  <div class="t-right touch-only">
    <div class="t-pedals">
      <div class="pedal pedal-brake" data-pp="brake"><i class="pedal-fill"></i><span>브레이크</span></div>
      <div class="pedal pedal-gas" data-pp="gas"><i class="pedal-fill"></i><span>엑셀</span></div>
    </div>
  </div>
</div>

<div class="overlay menu" id="menu" hidden>
  <div class="menu-head">
    <h1 class="menu-title">붕붕이</h1>
    <p class="menu-sub">주차와 시내 주행을 상황별로 연습해요.</p>
    <button class="btn btn-primary" id="btn-resume" hidden>이어서 주행</button>
  </div>
  <div class="lesson-ask panel" id="lesson-ask" role="group" aria-labelledby="lesson-ask-q" hidden>
    <p id="lesson-ask-q">처음이라면 튜토리얼부터 할까요?</p>
    <button class="btn btn-primary" id="ask-start">시작</button>
    <button class="btn" id="ask-skip">건너뛰기</button>
  </div>
  <div class="mode-tabs" role="tablist" aria-label="연습 종류">
    <button class="btn" id="mode-lesson" role="tab" aria-selected="false">처음이라면</button>
    <button class="btn" id="mode-parking" role="tab" aria-selected="true">주차</button>
    <button class="btn" id="mode-city" role="tab" aria-selected="false">주행</button>
    <button class="btn" id="mode-records" role="tab" aria-selected="false">내 기록</button>
  </div>
  <div class="tabs" role="tablist" aria-label="주차 장소" id="tabs"></div>
  <div class="cards" id="cards" role="tabpanel"></div>
  <div class="menu-foot">
    <span class="spec" id="spec"></span>
    <label class="voice-toggle"><input type="checkbox" id="voice-enabled" checked>내비 음성</label>
    <label class="vol">효과음 <input type="range" id="vol" min="0" max="1" step="0.05" aria-label="효과음 크기"></label>
  </div>
</div>

<div class="overlay result" id="result" hidden>
  <div class="result-card" role="dialog" aria-labelledby="res-grade">
    <p class="result-map" id="res-map"></p>
    <h2 class="result-grade" id="res-grade"></h2>
    <dl class="result-stats">
      <div><dt>접촉</dt><dd id="res-contacts"></dd></div>
      <div><dt>전후진 전환</dt><dd id="res-switches"></dd></div>
      <div><dt>시간</dt><dd id="res-time"></dd></div>
    </dl>
    <p class="result-reason" id="res-reason" hidden></p>
    <ol class="penalties" id="res-penalties" hidden></ol>
    <p class="result-praise" id="res-praise" hidden></p>
    <p class="result-best" id="res-best"></p>
    <div class="result-actions">
      <button class="btn" id="res-retry">다시</button>
      <button class="btn btn-primary" id="res-next">다음 맵</button>
      <button class="btn" id="res-menu">메뉴</button>
    </div>
  </div>
</div>

<div class="overlay result" id="review-done" hidden>
  <div class="result-card" role="dialog" aria-labelledby="rv-title">
    <p class="result-map" id="rv-map"></p>
    <h2 class="result-grade" id="rv-title">복습 끝</h2>
    <p class="result-reason" id="rv-line"></p>
    <p class="result-best" id="rv-tip"></p>
    <div class="result-actions">
      <button class="btn btn-primary" id="rv-records">내 기록 보기</button>
    </div>
  </div>
</div>

<div class="rotate">휴대폰을 가로로 돌려주세요<small>핸들과 페달을 함께 쓰려면 가로 화면이 필요해요.</small><button class="btn" id="rotate-skip" type="button">그냥 계속</button></div>
