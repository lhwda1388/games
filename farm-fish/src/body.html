<div id="stage"><div id="app">
  <header id="hud">
    <span class="coin" aria-hidden="true"></span><b id="coins" aria-label="코인">0</b>
    <span class="spacer"></span>
    <button id="bagBtn" type="button" aria-label="바구니와 주문"></button>
    <button id="shopBtn" type="button">상점</button>
    <button id="dexBtn" type="button">도감</button>
    <button id="pipBtn" type="button" title="작게 띄우기" hidden><span class="mono-emoji">📌</span> 작게</button>
  </header>
  <canvas id="cv" width="180" height="200" aria-label="농장과 연못"></canvas>
  <button id="clockBtn" type="button" aria-label="달력 열기"></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="reelHud" hidden>
    <span>장력</span><div class="bar" id="tWrap"><i id="tBar"></i></div>
    <span>낚기</span><div class="bar catch"><i id="cBar"></i></div>
  </div>
  <div id="reelCue" hidden></div>
  <div id="result" hidden></div>
  <nav id="tray" aria-label="씨앗"></nav>
  <div id="floats"></div>
  <section id="dex" class="overlay" hidden aria-label="도감"></section>
  <section id="shop" class="overlay" hidden aria-label="상점"></section>
  <section id="bag" class="overlay" hidden aria-label="바구니와 주문"></section>
  <section id="cal" class="overlay" hidden aria-label="달력과 낚시터"></section>
</div></div>
<div id="pipHint" hidden role="status">
  <p>아무 곳이나 클릭하면 작게 떠요</p>
  <label><input type="checkbox" id="pipAuto" checked> 열면 바로 작게 띄우기</label>
</div>
