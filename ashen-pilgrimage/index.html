<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잿빛 순례</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
/* Hallmark · scope: game canvas (macrostructure n/a) · tone: gothic atmospheric · anchor hue: blood 25 */
:root {
  --color-void: oklch(9% 0.01 30);
  --color-floor: oklch(27% 0.02 55);
  --color-floor-2: oklch(23% 0.02 50);
  --color-wall: oklch(30% 0.015 45);
  --color-wall-top: oklch(42% 0.02 55);
  --color-ink: oklch(88% 0.03 80);
  --color-dim: oklch(58% 0.03 70);
  --color-blood: oklch(50% 0.2 25);
  --color-mana: oklch(50% 0.18 265);
  --color-gold: oklch(82% 0.14 85);
  --color-magic: oklch(70% 0.15 260);
  --color-rare: oklch(90% 0.16 100);
  --color-unique: oklch(72% 0.13 65);
  --color-fire: oklch(76% 0.18 55);
  --color-bone: oklch(80% 0.02 90);
  --color-rot: oklch(55% 0.1 140);
  --color-rot-dark: oklch(38% 0.07 140);
  --color-blood-dark: oklch(32% 0.13 25);
  --color-steel: oklch(68% 0.015 250);
  --color-wood: oklch(45% 0.06 60);
  --color-skin: oklch(74% 0.06 60);
  --color-shade: oklch(30% 0.06 300);
  --color-steel-dark: oklch(46% 0.015 250);
  --color-steel-light: oklch(85% 0.01 250);
  --color-leather: oklch(36% 0.04 55);
  --color-leather-light: oklch(46% 0.05 60);
  --color-bone-dark: oklch(60% 0.025 80);
  --color-mana-dark: oklch(36% 0.15 265);
  --color-magic-dark: oklch(50% 0.13 260);
  --color-unique-dark: oklch(52% 0.11 60);
  --color-rust: oklch(48% 0.09 45);
  --color-outline: oklch(7% 0.01 30);
  --color-void-glass: oklch(9% 0.01 30 / .72);
  /* 막별 타일셋 */
  --color-t-town-floor: oklch(36% 0.04 105);
  --color-t-town-floor2: oklch(32% 0.04 100);
  --color-t-town-wall: oklch(30% 0.05 60);
  --color-t-town-top: oklch(44% 0.06 65);
  --color-t-a1-floor: oklch(27% 0.02 55);
  --color-t-a1-floor2: oklch(23% 0.02 50);
  --color-t-a1-wall: oklch(30% 0.015 45);
  --color-t-a1-top: oklch(42% 0.02 55);
  --color-t-a2-floor: oklch(44% 0.05 80);
  --color-t-a2-floor2: oklch(39% 0.05 75);
  --color-t-a2-wall: oklch(36% 0.04 70);
  --color-t-a2-top: oklch(55% 0.06 80);
  --color-t-a3-floor: oklch(29% 0.04 150);
  --color-t-a3-floor2: oklch(25% 0.04 145);
  --color-t-a3-wall: oklch(24% 0.05 140);
  --color-t-a3-top: oklch(37% 0.07 140);
  --color-t-a4-floor: oklch(25% 0.05 30);
  --color-t-a4-floor2: oklch(21% 0.06 25);
  --color-t-a4-wall: oklch(22% 0.06 20);
  --color-t-a4-top: oklch(36% 0.1 30);
  --font-display: "Cinzel", "Noto Serif KR", serif;
  --font-body: "Noto Serif KR", serif;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
}
html, body { margin: 0; height: 100%; background: var(--color-void); overflow-x: clip; overflow: hidden; }
canvas { display: block; cursor: crosshair; touch-action: none; }
#panel {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); scrollbar-color: var(--color-wall-top) var(--color-void); overflow-y: auto; box-sizing: border-box;
  padding: 24px; background: var(--color-void); color: var(--color-ink); font-family: var(--font-body);
  border: 1px solid var(--color-wall-top); box-shadow: 0 0 0 4px var(--color-floor-2);
}
#panel[hidden] { display: none; }
#panel h2 { margin: 0 0 12px; font: 700 22px/1.3 var(--font-display); color: var(--color-gold); }
#panel p { margin: 0 0 20px; line-height: 1.7; white-space: pre-line; color: var(--color-bone); }
#p-btns { display: flex; flex-direction: column; gap: 8px; }
#panel button {
  font: inherit; font-size: 15px; text-align: left; padding: 10px 14px; cursor: pointer;
  background: var(--color-floor-2); color: var(--color-ink); border: 1px solid var(--color-wall);
  transition: background-color 120ms var(--ease-out), border-color 120ms var(--ease-out);
}
#panel button.has-icon { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 14px 6px 6px; }
#panel button canvas { display: block; background: var(--color-floor-2); }
#panel button small { display: block; margin-top: 2px; font-size: 13px; color: var(--color-dim); }
#panel button:hover:not(:disabled) { background: var(--color-floor); border-color: var(--color-gold); }
#panel button:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; }
#panel button:active:not(:disabled) { transform: translateY(1px); }
#panel button:disabled { opacity: .45; cursor: default; }
/* 인벤토리: 장비 인형(3×3) + 가방 격자(5×4). 칸 테두리·글자 = 등급색 */
#panel.inv { width: min(640px, calc(100% - 32px)); }
#panel.inv p { margin-bottom: 16px; }
.inv-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
.inv-doll { display: grid; grid-template-columns: repeat(3, 64px); grid-template-areas: ". helm amulet" "weapon armor ring" "gloves boots ."; gap: 6px; }
.inv-bag { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
#panel .cell {
  position: relative; aspect-ratio: 1; min-width: 0; padding: 2px; display: grid; place-items: center;
  font-size: 12px; text-align: center; word-break: keep-all;
  color: var(--rar, var(--color-dim)); border-color: var(--rar, var(--color-wall));
}
#panel .cell.empty { border-style: dashed; background: var(--color-void); }
#panel .cell.empty:disabled { opacity: .6; }
#panel .cell[data-cmp]::after { content: attr(data-cmp); position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--color-blood); }
#panel .cell[data-cmp="▲"]::after { color: var(--color-rot); }
#panel .cell:hover:not(:disabled) { border-color: var(--color-gold); }
.inv-detail { min-height: 7.5em; margin: 16px 0; padding-top: 12px; border-top: 1px solid var(--color-wall); }
.inv-detail .inv-name { font: 700 17px/1.4 var(--font-display); }
#panel .inv-detail p { margin: 4px 0 0; font-size: 14px; line-height: 1.6; }
.inv-detail .inv-meta, .inv-detail .inv-hint { color: var(--color-dim); }
.inv-diff { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.inv-diff .up { color: var(--color-rot); }
.inv-diff .down { color: var(--color-blood); }
.inv-actions { display: flex; flex-wrap: wrap; gap: 8px; }
#panel .inv-actions button { flex: 1 1 auto; white-space: nowrap; }
/* 터치 메뉴: 터치 기기(html.touch)에서만, 왼쪽 위 세로 줄 */
#touch { display: none; }
html.touch {
  & #touch { position: fixed; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 6px; }
  & #touch button {
    min-width: 52px; min-height: 44px; padding: 0 8px; font: 700 13px/1 var(--font-body); white-space: nowrap;
    color: var(--color-ink); background: var(--color-void-glass); border: 1px solid var(--color-wall-top);
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  & #touch button[hidden] { display: none; }
  & #touch button:active { transform: translateY(1px); background: var(--color-floor-2); }
  & #touch button:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; }
  & #panel button, & #chat-in { touch-action: manipulation; }
}
canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* 채팅 (멀티플레이): 오른쪽 아래, 평소엔 클릭이 게임으로 지나가고 입력 중에만 잡는다 */
#chat {
  position: fixed; right: 16px; bottom: 112px; width: min(340px, calc(100% - 32px));
  font: 400 13px/1.5 var(--font-body); color: var(--color-ink); pointer-events: none;
}
#chat[hidden] { display: none; }
#chat-log { max-height: 9em; overflow-y: auto; margin: 0; padding: 6px 10px; list-style: none; background: var(--color-void-glass); scrollbar-width: thin; }
#chat-log:empty { display: none; }
#chat-log b { color: var(--color-gold); font-weight: 700; }
#chat.typing { pointer-events: auto; }
#chat-in {
  box-sizing: border-box; width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit;
  color: var(--color-ink); background: var(--color-void); border: 1px solid var(--color-wall-top);
}
#chat-in:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 0; }
@media (max-width: 560px) { .inv-body { grid-template-columns: minmax(0, 1fr); justify-items: center; } .inv-bag { width: 100%; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav id="touch" aria-label="메뉴">
  <button data-a="inv">가방</button><button data-a="skills">스킬</button><button data-a="tp">귀환</button>
  <button data-a="map">지도</button><button data-a="chat" hidden>채팅</button>
</nav>
<div id="chat" hidden>
  <ol id="chat-log" aria-live="polite" aria-label="채팅 기록"></ol>
  <input id="chat-in" maxlength="80" autocomplete="off" placeholder="Enter 보내기 · Esc 취소" aria-label="채팅 입력" hidden>
</div>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden>
  <h2 id="p-title"></h2>
  <p id="p-text"></p>
  <div id="p-btns"></div>
</div>
<script>
const css = getComputedStyle(document.documentElement);
const P = {};
for (const k of ['void','floor','floor-2','wall','wall-top','ink','dim','blood','mana','gold','magic','rare','unique','fire','bone','rot','rot-dark','blood-dark','steel','wood','skin','shade','steel-dark','steel-light','leather','leather-light','bone-dark','mana-dark','magic-dark','unique-dark','rust','outline'])
  P[k] = css.getPropertyValue('--color-' + k).trim();
for (const set of ['town', 'a1', 'a2', 'a3', 'a4']) for (const k of ['floor', 'floor2', 'wall', 'top'])
  P[`t-${set}-${k}`] = css.getPropertyValue(`--color-t-${set}-${k}`).trim();
const FD = css.getPropertyValue('--font-display').trim(), FB = css.getPropertyValue('--font-body').trim();

const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const light = document.createElement('canvas'), lctx = light.getContext('2d');
const T = 40, W = 60, H = 60, HUDH = 100, BOSS = 4;
let vw, vh;
function resize() { vw = cv.width = light.width = innerWidth; vh = cv.height = light.height = innerHeight; }
addEventListener('resize', resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---------- 직업 / 스킬 ----------
const CLASSES = {
  warrior: { name: '전사', desc: '무거운 검과 갑옷. 적의 한가운데로 뛰어든다.', hp: 130, mp: 30, hpL: 15, mpL: 3, regen: 1.5, mult: 1.3, basic: 'melee',
    skills: ['bash', 'leap', 'cry', 'whirl'] },
  sorc: { name: '소서리스', desc: '원소를 부리는 마법사. 몸은 약하지만 마나가 넘친다.', hp: 80, mp: 90, hpL: 8, mpL: 8, regen: 4, mult: .6, basic: 'melee',
    skills: ['fireball', 'nova', 'teleport', 'chain'] },
  ranger: { name: '레인저', desc: '그림자 속의 궁수. 멀리서 화살을 쏟아붓는다.', hp: 100, mp: 50, hpL: 11, mpL: 5, regen: 2.5, mult: 1, basic: 'bow',
    skills: ['multi', 'pierce', 'ice', 'rain'] },
  necro: { name: '네크로맨서', desc: '죽음을 부리는 자. 해골 군단과 저주, 시체 폭발.', hp: 90, mp: 80, hpL: 9, mpL: 7, regen: 3.5, mult: .6, basic: 'melee',
    skills: ['spear', 'raise', 'amp', 'corpse'] },
};
const cls = () => CLASSES[player.cls];
const pct = (base, per, r) => Math.round((base + per * (r - 1)) * 100);
// 무기 기반 피해 / 레벨 기반 주문 피해
const wdmg = k => Math.max(1, Math.round(rollDmg() * k));
const sdmg = (base, perLvl, r) => Math.round((base + player.lvl * perLvl) * (1 + .3 * (r - 1)));

const SK = {
  bash: { name: '강타', short: '강타', mp: 3, lv: 1, desc: r => `앞의 적을 무기 피해 ${pct(1.8, .3, r)}%로 내려치고 밀쳐낸다`,
    fn(r) { const a = player.face, x = player.x + Math.cos(a) * 34, y = player.y + Math.sin(a) * 34;
      aoe(x, y, 34, wdmg(cls().mult * (1.8 + .3 * (r - 1))), m => push(m, a, 30));
      ring(x, y, 34, 'bone', .25); } },
  leap: { name: '도약 강타', short: '도약', mp: 8, lv: 3, desc: r => `커서 위치로 뛰어올라 주변에 무기 피해 ${pct(1.2, .3, r)}%, 기절`,
    fn(r, w) { const d = Math.min(240, dist(player, w)), a = player.face, x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d;
      if (blocked(x, y, player.r)) { log('그곳으로 뛸 수 없다', 'dim'); return false; }
      player.x = x; player.y = y;
      aoe(x, y, 80, wdmg(cls().mult * (1.2 + .3 * (r - 1))), m => stun(m, .8));
      ring(x, y, 80, 'gold', .35); } },
  cry: { name: '전투 함성', short: '함성', mp: 10, lv: 6, desc: r => `주변 적에게 ${sdmg(5, 2, r)} 피해, ${(1.5 + .2 * r).toFixed(1)}초 기절`,
    fn(r) { aoe(player.x, player.y, 150, sdmg(5, 2, r), m => stun(m, 1.5 + .2 * r)); ring(player.x, player.y, 150, 'gold', .4); } },
  whirl: { name: '소용돌이', short: '회오리', mp: 15, lv: 12, desc: r => `커서 쪽으로 회전하며 0.2초마다 무기 피해 ${pct(.6, .15, r)}%`,
    fn(r, w) { player.whirl = 1.2 + .1 * r; player.whirlTo = { ...w }; player.whirlTick = 0; player.whirlR = r; } },

  fireball: { name: '화염구', short: '화염구', mp: 6, lv: 1, desc: r => `폭발하는 불덩이. ${sdmg(8, 3, r)} 범위 피해`,
    fn(r) { shoot(player.face, 420, { kind: 'fire', aoe: 55, dmg: sdmg(8, 3, r) + (sum('dmg') >> 1) }); } },
  nova: { name: '서리 고리', short: '서리', mp: 10, lv: 3, desc: r => `주변 적에게 ${sdmg(6, 2, r)} 피해, 3초간 감속`,
    fn(r) { aoe(player.x, player.y, 140, sdmg(6, 2, r), m => m.slow = 3); ring(player.x, player.y, 140, 'magic', .4); } },
  teleport: { name: '순간이동', short: '순간', mp: 12, lv: 6, desc: r => `보이는 곳으로 즉시 이동 (최대 ${380 + r * 20}px)`,
    fn(r, w) { const tx = Math.floor(w.x / T), ty = Math.floor(w.y / T);
      if (dist(player, w) > 380 + r * 20 || blocked(w.x, w.y, player.r) || !seen[ty]?.[tx]) { log('그곳으로 갈 수 없다', 'dim'); return false; }
      ring(player.x, player.y, 30, 'magic', .3); player.x = w.x; player.y = w.y; ring(w.x, w.y, 30, 'magic', .3); } },
  chain: { name: '연쇄 번개', short: '번개', mp: 14, lv: 12, desc: r => `${sdmg(10, 3, r)} 피해 번개가 적 ${3 + r}명에게 튄다`,
    fn(r, w) {
      let cur = monsters.filter(visible).sort((a, b) => dist(a, w) - dist(b, w))[0];
      if (!cur || dist(cur, w) > 120) { log('대상이 없다', 'dim'); return false; }
      const hit = new Set(), pts = [[player.x, player.y - 12]], d = sdmg(10, 3, r);
      for (let i = 0; i < 3 + r && cur; i++) {
        pts.push([cur.x, cur.y - 8]); hit.add(cur); hurtMonster(cur, d);
        const from = cur;
        cur = monsters.filter(m => !hit.has(m) && dist(m, from) < 170).sort((a, b) => dist(a, from) - dist(b, from))[0];
      }
      fx.push({ kind: 'bolt', pts, t: 0, dur: .3 }); } },

  multi: { name: '다중 사격', short: '다중', mp: 6, lv: 1, desc: r => `화살 ${Math.min(9, 2 + r)}발을 부채꼴로, 각 무기 피해 ${pct(.7, .1, r)}%`,
    fn(r) { const n = Math.min(9, 2 + r);
      for (let i = 0; i < n; i++) shoot(player.face + (i - (n - 1) / 2) * .14, 520, { kind: 'arrow', dmg: wdmg(.7 + .1 * (r - 1)) }); } },
  pierce: { name: '관통 사격', short: '관통', mp: 5, lv: 3, desc: r => `적을 꿰뚫는 화살. 무기 피해 ${pct(1.6, .3, r)}%`,
    fn(r) { shoot(player.face, 640, { kind: 'arrow', pierce: true, dmg: wdmg(1.6 + .3 * (r - 1)) }); } },
  ice: { name: '얼음 화살', short: '얼음', mp: 8, lv: 6, desc: r => `무기 피해 ${pct(1, .2, r)}%, ${(1.5 + .2 * r).toFixed(1)}초 빙결`,
    fn(r) { shoot(player.face, 560, { kind: 'ice', dmg: wdmg(1 + .2 * (r - 1)), freeze: 1.5 + .2 * r }); } },
  rain: { name: '화살비', short: '화살비', mp: 14, lv: 12, desc: r => `커서 위치에 1.5초간 화살비. 0.25초마다 무기 피해 ${pct(.5, .12, r)}%`,
    fn(r, w) { zones.push({ x: w.x, y: w.y, rad: 90, t: 1.5, tick: 0, r, by: player }); } },
};

SK.spear = { name: '뼈 창', short: '뼈창', mp: 6, lv: 1, desc: r => `적을 꿰뚫는 뼈 창. ${sdmg(9, 3, r)} 피해`,
  fn(r) { shoot(player.face, 560, { kind: 'bone', pierce: true, dmg: sdmg(9, 3, r), life: 1.1 }); } };
SK.raise = { name: '해골 소환', short: '해골', mp: 10, lv: 3, desc: r => `해골 전사를 소환한다 (최대 ${1 + r}기, 생명력 ${allyHp(r)})`,
  fn(r, w) {
    if (allies.length >= 1 + r) { log(`더 소환할 수 없다 (최대 ${1 + r}기)`, 'dim'); return false; }
    const at = dist(player, w) < 200 && !blocked(w.x, w.y, 11) ? w : player;
    allies.push(makeAlly(at.x + rnd(-6, 6), at.y + rnd(-6, 6), r)); ring(at.x, at.y, 24, 'magic', .4); } };
SK.amp = { name: '피해 증폭', short: '증폭', mp: 8, lv: 6, desc: r => `범위 안의 적이 ${4 + r}초간 2배 피해를 받는다`,
  fn(r, w) { for (const m of monsters) if (dist(m, w) < 110 + m.r) m.cursed = 4 + r; ring(w.x, w.y, 110, 'blood', .4); } };
SK.corpse = { name: '시체 폭발', short: '시폭', mp: 12, lv: 12, desc: r => `시체를 터뜨려 원래 생명력의 ${pct(.5, .1, r)}%만큼 범위 피해`,
  fn(r, w) {
    const k = corpses.filter(c => c.mhp && dist(c, w) < 120).sort((a, b) => dist(a, w) - dist(b, w))[0];
    if (!k) { log('근처에 시체가 없다', 'dim'); return false; }
    corpses.splice(corpses.indexOf(k), 1);
    aoe(k.x, k.y, 90, Math.round(k.mhp * (.5 + .1 * (r - 1))));
    fx.push({ kind: 'boom', x: k.x, y: k.y, t: 0, dur: .35 }); } };
const allyHp = r => Math.round((30 + player.lvl * 8) * (1 + .2 * (r - 1)));
const makeAlly = (x, y, r) => ({ ...MT.skeleton, ...fresh, name: '해골 하수인', ally: true, owner: player, tint: 'magic', x, y, spd: 120,

function newMap() {

function addRoom(x, y, w, h) {
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) map[yy][xx] = 0;
  const r = { x, y, w, h, c: { x: x + (w >> 1), y: y + (h >> 1) } };
  rooms.push(r); return r;
}
function carve(a, b) {
  let x = a.x, y = a.y;
  const hz = () => { while (x !== b.x) { x += Math.sign(b.x - x); map[y][x] = map[y + 1][x] = 0; } };
  const vt = () => { while (y !== b.y) { y += Math.sign(b.y - y); map[y][x] = map[y][x + 1] = 0; } };
  if (Math.random() < .5) { hz(); vt(); } else { vt(); hz(); }
}
// 바닥과 닿지 않은 벽은 2(깊은 암반) — 그리지 않음
function finishWalls() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (map[y][x] !== 1) continue;
    let near = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (map[y + dy]?.[x + dx] === 0) near = true;
    if (!near) map[y][x] = 2;
  }
}
const ctr = t => ({ x: (t.x + .5) * T, y: (t.y + .5) * T });

function genLevel(f) {

    const entry = addRoom(26, 50, 8, 6), arena = addRoom(17, 14, 26, 20);
    carve(entry.c, arena.c);
    for (const [x, y] of [[22, 19], [36, 19], [22, 28], [36, 28]]) for (let d = 0; d < 4; d++) map[y + (d >> 1)][x + (d & 1)] = 1;
    finishWalls();

  } else {
    for (let i = 0; i < 300 && rooms.length < 12; i++) {
      const w = ri(5, 11), h = ri(5, 9), x = ri(2, W - w - 3), y = ri(2, H - h - 3);
      if (rooms.some(r => x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y)) continue;
      const prev = rooms[rooms.length - 1], r = addRoom(x, y, w, h);
      if (prev) carve(prev.c, r.c);
    }
    finishWalls();
    start = ctr(rooms[0].c);
    const st = ctr(rooms[rooms.length - 1].c);
    objs.push({ type: 'stairs', ...st, name: '↓ ' + floorName(f + 1) });

}

function genItem(lv, minRar = 0, mf = 0) {
  const roll = Math.random() / (1 + mf / 100);
  const rar = Math.max(minRar, roll < .03 ? 3 : roll < .15 ? 2 : roll < .45 ? 1 : 0);
  const u = rar === 3 ? pick(UNIQ) : null, slot = u ? u.slot : pick(SLOTS)[0];
  const k = (1 + rar * .5) * rnd(.7, 1.3), st = {};
  if (slot === 'weapon') st.dmg = Math.max(1, Math.round((2 + lv * 1.5) * k));
  if (DEFK[slot]) st.def = Math.max(1, Math.round((1 + lv) * DEFK[slot] * k));
  const n = rar + (slot === 'ring' || slot === 'amulet');
  for (let i = 0; i < n; i++) {
    const key = pick(Object.keys(STATS));
    st[key] = (st[key] || 0) + Math.max(1, Math.round(STATS[key][1](lv) * rnd(.6, 1.2)));
  }
  const base = pick(BASES[slot]);
  const name = u ? u.name
    : rar === 2 ? `${pick(['피의', '어둠의', '폭풍의', '망자의'])} ${base}`
    : rar === 1 ? `${pick(['날카로운', '단단한', '푸른', '붉은'])} ${base}` : base;
  return { slot, rar, name, st, ...(u && { fx: u.fx, fxd: u.fxd }) };
}

function drop(x, y, m) {

  const at = () => { const p = { x: x + rnd(-18, 18), y: y + rnd(-18, 18) }; return solid(p.x, p.y) ? { x, y } : p; };
  if (Math.random() < .45 || m.boss) items.push({ ...at(), kind: 'gold', amt: ri(2, 8) * diff() * (m.boss ? 10 : 1) });
  if (Math.random() < .18) items.push({ ...at(), kind: pick(['hp', 'hp', 'mp']) });
  const mf = sum('mf'), eq = (lv, r) => { const it = genItem(lv, r, mf); items.push({ ...at(), kind: 'eq', item: it }); if (it.rar >= 2) sfx('drop'); };
  if (m.boss) for (let i = 0; i < 3; i++) eq(diff() + 2, i ? 1 : 2);
  else if (m.elite) for (let i = 0; i < 2; i++) eq(diff() + 1, 1);

}

const solid = (px, py) => map[Math.floor(py / T)]?.[Math.floor(px / T)] !== 0;

    for (const [dx, dy] of DIRS) {

      const n = ny * W + nx;

// 사람형은 발을 축으로 뒤로 쓰러지고, 해골은 무너지고, 박쥐는 떨어지고, 사냥개는 옆으로 눕는다
function poseA(kind, e, p, c) {
  const k = p.die ? 1 - (1 - p.die) ** 3 : 0;
  if (k && kind === 'bat') { ctx.translate(0, 22 * k); ctx.translate(0, -12); ctx.rotate(Math.PI * k); ctx.translate(0, 12); }
  else if (k && kind === 'hound') { ctx.translate(0, 10); ctx.scale(1, 1 - .35 * k); ctx.rotate(.15 * k); ctx.translate(0, -10); }
  else if (k && kind !== 'skeleton') { ctx.translate(0, 10 - 4 * k); ctx.rotate(-Math.PI / 2 * k); ctx.translate(0, -10); }
  DRAW[kind === 'hero' ? e.cls : kind](p, c, e);
}
// 틴트(보스·소환수 색 바꾸기)와 피격 깜빡임
const TINTK = { bone: '', blood: '', rot: '', 'bone-dark': '-dark', 'blood-dark': '-dark', 'rot-dark': '-dark' };
const colorFn = e => k => e.flash > 0 ? P.ink : e.tint && k in TINTK ? P[e.tint + TINTK[k]] ?? P[e.tint] : P[k];
function poseOf(e, die = 0) {
  return {
    t: performance.now() / 1000 + (e.seed || 0),
    walk: !die && performance.now() - (e.lastMove || 0) < 120 ? (e.anim || 0) * .3 : null,
    atk: !die && e.swing > 0 ? 1 - e.swing / (e.swingDur || .25) : null,
    die,
  };
}

// ---- 도트 변환: 저해상도로 그림 → 팔레트로 줄임 → 3단 명암 → 1px 외곽선 ----
const ART = .75, PXS = 2;   // 캐릭터 단위당 도트 수, 도트 1개의 화면 px
const rgbOf = (() => {
  const g = document.createElement('canvas').getContext('2d', { willReadFrequently: true }); g.canvas.width = g.canvas.height = 1;
  return col => { g.clearRect(0, 0, 1, 1); g.fillStyle = col; g.fillRect(0, 0, 1, 1); return [...g.getImageData(0, 0, 1, 1).data.slice(0, 3)]; };

// 각 색 = [기본, 어두운 면, 밝은 면]. 빛나는 색(불·마법·금·흰색)은 명암 없이 그대로
const GLOWING = new Set(['fire', 'magic', 'gold', 'ink', 'rare']);
const PAL = ['blood', 'blood-dark', 'mana', 'mana-dark', 'gold', 'magic', 'magic-dark', 'fire', 'bone', 'bone-dark', 'steel', 'steel-dark', 'steel-light',
  'wood', 'leather', 'leather-light', 'skin', 'shade', 'rust', 'rot', 'rot-dark', 'unique', 'unique-dark', 'dim', 'wall', 'wall-top', 'ink', 'rare', 'void']
  .map(k => { const [r, g, b] = rgbOf(P[k]); const f = GLOWING.has(k) || k === 'void' ? 1 : 0;
    return [[r, g, b], f ? [r, g, b] : [r * .68, g * .68, b * .68], f ? [r, g, b] : [r + (255 - r) * .2, g + (255 - g) * .2, b + (255 - b) * .2]]; });

const work = document.createElement('canvas'), wx = work.getContext('2d', { willReadFrequently: true });
work.width = 160; work.height = 110;
function pixelSprite(e, kind, p, s, out) {

  wx.setTransform(1, 0, 0, 1, 0, 0); wx.clearRect(0, 0, w, h);
  wx.setTransform(k, 0, 0, k, ox, oy);

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, j = i * 4;
    if (d[j + 3] < 110) { d[j + 3] = 0; continue; }
    const key = d[j] << 16 | d[j + 1] << 8 | d[j + 2];
    let best = nearest.get(key);
    if (best === undefined) {
      let bd = Infinity;
      for (let q = 0; q < PAL.length; q++) { const [r, g, b] = PAL[q][0], dd = (d[j] - r) ** 2 + (d[j + 1] - g) ** 2 + (d[j + 2] - b) ** 2; if (dd < bd) { bd = dd; best = q; } }

    const j = i * 4; [d[j], d[j + 1], d[j + 2]] = OUTLINE; d[j + 3] = 255;
  }
  if (out.width !== w || out.height !== h) { out.width = w; out.height = h; }

}
// 도트 그림은 초당 8번만 새로 그려 캐시 (움직임도 8fps로 끊겨 레트로 느낌). 시체는 한 번만.
function sprite(e, kind, die, s) {
  const key = die >= 1 ? `dead|${e.left}` : `${Math.floor(performance.now() / 125)}|${e.flash > 0}|${e.left}|${die > 0}`;
  if (!e._pix || e._pix.key !== key) {
    e._pix ||= { cv: document.createElement('canvas') };
    Object.assign(e._pix, { key }, pixelSprite(e, kind, poseOf(e, die), s, e._pix.cv));

function drawChar(e, kind, die = 0) {
  const s = e.scale || (e.elite ? 1.3 : 1), u = 1.5 * s;   // 화면 px / 캐릭터 단위
  if (e.fixedLeft != null) e.left = e.fixedLeft;

  if (!die) {
    if (e.elite || e.boss) {

      oval(e.x, e.y + 9 * u, 15 * u, 5.5 * u, e.boss ? P.fire : P.magic);

// 죽은 자리에 남는 시체 (네크로맨서 시체 폭발 대상이기도 함; mhp 0이면 폭발 불가)
function addCorpse(m, explodable) {

    e: { x: m.x, y: m.y, kind: m.kind, tint: m.tint, elite: m.elite, scale: m.scale, seed: m.seed, ranged: m.ranged, r: m.r, fixedLeft: player.x < m.x } });

function drawObj(o) {
  const t = performance.now() / 1000;
  if (o.type === 'stairs') {
    ctx.fillStyle = P.void; ctx.fillRect(o.x - 16, o.y - 16, 32, 32);
    for (let i = 0; i < 4; i++) limb(o.x - 14 + i * 3, o.y - 12 + i * 7, o.x + 14 - i * 3, o.y - 12 + i * 7, 2, P.dim);
  } else if (o.type === 'waypoint') {

    limb(o.x - 21, o.y - 32, o.x + 21, o.y - 32, 5, P.wood);

    ctx.globalAlpha = .5; oval(o.x, o.y - 18, 4, 10, P.ink); ctx.globalAlpha = 1;

    const f = Math.sin(t * 13) * 2;

    poly(P.rare, o.x - 4, o.y + 2, o.x - f, o.y - 12, o.x + 4, o.y + 2);

// ---------- 렌더 ----------
function drawWorld() {
  const x0 = Math.max(0, Math.floor(cam.x / T)), x1 = Math.min(W - 1, Math.floor((cam.x + vw) / T)),
        y0 = Math.max(0, Math.floor(cam.y / T)), y1 = Math.min(H - 1, Math.floor((cam.y + vh) / T));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!seen[y][x] || map[y][x] === 2) continue;
    const px = x * T, py = y * T;
    if (map[y][x] === 0) {
      ctx.fillStyle = (x * 7 + y * 13) % 5 === 0 ? TP.floor2 : TP.floor;
      ctx.fillRect(px, py, T, T);
      ctx.strokeStyle = TP.floor2; ctx.lineWidth = 1;
      ctx.strokeRect(px + .5, py + .5, T - 1, T - 1);
    } else {
      ctx.fillStyle = TP.top; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = TP.wall; ctx.fillRect(px, py + (y % 2 ? 0 : T / 2), T, 2);
      if (map[y + 1]?.[x] === 0) { ctx.fillStyle = TP.wall; ctx.fillRect(px, py + T - 16, T, 16); }
    }
  }
  ctx.fillStyle = P.blood; ctx.globalAlpha = .45;
  for (const d of decals) { ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * .6, 0, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const k of corpses) if (visible(k)) drawChar(k.e, k.e.kind, Math.min(1, k.t / .55));   // 핏자국 위에 시체

  for (const o of objs) if (o.type !== 'npc' && seen[Math.floor(o.y / T)][Math.floor(o.x / T)]) drawObj(o);

  for (const it of items) {
    if (!visible(it)) continue;
    if (it.kind === 'gold') { for (let i = 0; i < 3; i++) circ(it.x + i * 3 - 3, it.y - i * 2, 3.5, P.gold); }
    else if (it.kind === 'eq') {
      const col = P[RAR[it.item.rar]];
      if (it.item.rar >= 2) { ctx.globalAlpha = .22 + Math.sin(performance.now() / 300) * .08; ctx.fillStyle = col; ctx.fillRect(it.x - 3, it.y - 70, 6, 70); ctx.globalAlpha = 1; }
      ctx.fillStyle = col; ctx.fillRect(it.x - 5, it.y - 5, 10, 10);
    }
    else { ctx.fillStyle = it.kind === 'hp' ? P.blood : P.mana; ctx.fillRect(it.x - 3, it.y - 6, 6, 10); ctx.fillStyle = P.bone; ctx.fillRect(it.x - 2, it.y - 9, 4, 3); }
  }

  for (const z of zones) {
    ctx.globalAlpha = .25; oval(z.x, z.y, z.rad, z.rad * .5, P.wood); ctx.globalAlpha = 1;
    for (let i = 0; i < 6; i++) {
      const a = rnd(0, 7), d = rnd(0, z.rad), x = z.x + Math.cos(a) * d, y = z.y + Math.sin(a) * d * .5;
      limb(x - 3, y - 18, x, y, 1.2, P.bone);
    }
  }

  const actors = [...monsters.filter(visible), ...allies, ...objs.filter(o => o.type === 'npc'), ...heroes].sort((a, b) => a.y - b.y);
  for (const e of actors) {
    drawChar(e, e.cls ? 'hero' : e.type === 'npc' ? 'npc' : e.kind, e.cls && e.dead ? Math.min(1, (e.dieT || 0) / .55) : 0);
    const other = e.cls && e !== player, max = other ? as(e, mhp) : e.mhp;   // 동료 영웅은 생명력 막대를 항상 표시
    if ((other || e.ally || monsters.includes(e)) && !e.boss && (other || e.hp < max)) {
      const y = e.y - 52 * (e.elite ? 1.3 : 1);
      ctx.fillStyle = P.void; ctx.fillRect(e.x - 14, y, 28, 4);
      ctx.fillStyle = e.ally ? P.magic : other && !pvp ? P.rot : P.blood; ctx.fillRect(e.x - 14, y, 28 * Math.max(0, e.hp) / max, 4);
    }
  }

  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.life * 3); ctx.fillStyle = P[q.col]; ctx.fillRect(q.x, q.y, q.s, q.s); }
  ctx.globalAlpha = 1;
  for (const s of shots) {
    if (s.kind === 'fire' || s.kind === 'orb') { circ(s.x, s.y, s.kind === 'fire' ? 7 : 6, s.kind === 'fire' ? P.fire : P.blood); circ(s.x, s.y, 3, P.rare); }
    else { const sp = Math.hypot(s.vx, s.vy), len = s.kind === 'bone' ? 22 : 14;
      limb(s.x - s.vx / sp * len, s.y - s.vy / sp * len, s.x, s.y, s.kind === 'bone' ? 4 : 2, s.kind === 'ice' ? P.magic : P.bone); }
  }

    ctx.globalAlpha = 1 - k;
    if (f.kind === 'bolt') {
      ctx.strokeStyle = P.magic; ctx.lineWidth = 3; ctx.beginPath();
      f.pts.forEach(([x, y], i) => {

        for (let j = 1; j <= 4; j++) ctx.lineTo(px + (x - px) * j / 4 + (j < 4 ? rnd(-8, 8) : 0), py + (y - py) * j / 4 + (j < 4 ? rnd(-8, 8) : 0));
      });

  for (const t of texts) {

}

function drawLight() {
  lctx.globalCompositeOperation = 'source-over';
  lctx.fillStyle = P.void; lctx.globalAlpha = dark; lctx.fillRect(0, 0, vw, vh); lctx.globalAlpha = 1;
  lctx.globalCompositeOperation = 'destination-out';

    const g = lctx.createRadialGradient(x - cam.x, y - cam.y, 0, x - cam.x, y - cam.y, r);
    g.addColorStop(0, '#000'); g.addColorStop(.55, 'rgb(0 0 0 / .85)'); g.addColorStop(1, 'rgb(0 0 0 / 0)');
    lctx.fillStyle = g; lctx.fillRect(x - cam.x - r, y - cam.y - r, r * 2, r * 2);
  };
  for (const h of heroes) hole(h.x, h.y, (h === player ? lightR : 220) + Math.sin(performance.now() / 180) * 6);
  for (const s of shots) if (s.kind === 'fire' || s.kind === 'orb') hole(s.x, s.y, 110);
  for (const f of fx) if (f.kind === 'boom') hole(f.x, f.y, 140);
  for (const o of objs) if (['fire', 'portal', 'actPortal'].includes(o.type)) hole(o.x, o.y, 160);

}

  ctx.fillStyle = col; ctx.fillText(text, lx + 5, y + 13);
  return [lx, y, tw, 18];
}
function bubble(text, x, y, alpha) {
  ctx.font = `400 14px ${FB}`; ctx.textAlign = 'left'; ctx.globalAlpha = alpha;
  const t = text.length > 40 ? text.slice(0, 39) + '…' : text, w = ctx.measureText(t).width + 16, lx = Math.round(x - w / 2);
  ctx.fillStyle = P.bone; ctx.fillRect(lx, y - 26, w, 24); poly(P.bone, x - 5, y - 2, x + 5, y - 2, x, y + 5);
  ctx.fillStyle = P.void; ctx.fillText(t, lx + 8, y - 9);
  ctx.globalAlpha = 1;
}
function drawLabels() {
  ctx.font = `400 13px ${FB}`; ctx.textAlign = 'left';
  for (const it of items) {
    it.rect = null;
    if (visible(it) && it.kind === 'eq') it.rect = label(it.item.name, it.x - cam.x, it.y - cam.y - 28, P[RAR[it.item.rar]], hover === it);
  }
  for (const o of objs) {
    if (!o.name || !visible(o)) continue;
    const off = o.type === 'npc' ? 62 : o.type.includes('ortal') ? 62 : 40;
    label(o.name, o.x - cam.x, o.y - cam.y - off, o.type === 'npc' ? P.gold : o.type === 'actPortal' ? P.fire : P.ink, hover === o);
  }
  for (const h of heroes) if (h.sayT > 0 && h.say) bubble(h.say, h.x - cam.x, h.y - cam.y - (h === player ? 80 : 100), Math.min(1, h.sayT));
  for (const h of heroes) if (h !== player) label(`${heroName(h)} Lv ${h.lvl}${pvp ? ` · ${h.kills || 0}킬` : ''}`, h.x - cam.x, h.y - cam.y - 76, pvp ? P.blood : P.rot, hover === h);
}

// 디아블로2식 겹쳐 보는 지도: 본 곳만, 몬스터는 표시하지 않음
function drawMap() {
  if (!showMap) return;
  const s = 6, ox = vw / 2 - player.x / T * s, oy = (vh - HUDH) / 2 - player.y / T * s;
  ctx.globalAlpha = .5;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!seen[y][x] || map[y][x] === 2) continue;
    ctx.fillStyle = map[y][x] ? P.bone : P['wall-top'];
    ctx.fillRect(ox + x * s, oy + y * s, s, s);
  }
  ctx.globalAlpha = 1;
  const MK = { stairs: 'gold', waypoint: 'magic', gate: 'gold', portal: 'mana', actPortal: 'fire', npc: 'gold' };
  for (const o of objs) {
    if (!MK[o.type] || !seen[Math.floor(o.y / T)][Math.floor(o.x / T)]) continue;
    ctx.fillStyle = P[MK[o.type]]; ctx.fillRect(ox + o.x / T * s - 4, oy + o.y / T * s - 4, 8, 8);
  }
  for (const a of allies) circ(ox + a.x / T * s, oy + a.y / T * s, 2.5, P.magic);
  for (const h of heroes) if (h !== player) circ(ox + h.x / T * s, oy + h.y / T * s, 4, P.gold);
  circ(vw / 2, (vh - HUDH) / 2, 4, P.ink);
}

function orb(cx, cy, r, frac, col, text) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = P.void; ctx.fill(); ctx.clip();
  ctx.fillStyle = P[col]; ctx.fillRect(cx - r, cy + r - 2 * r * frac, 2 * r, 2 * r * frac);
  ctx.globalAlpha = .18;
  oval(cx - r * .3, cy - r * .45, r * .45, r * .25, P.ink, -.5);
  ctx.restore();
  ctx.strokeStyle = P['wall-top']; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  ctx.fillStyle = P.ink; ctx.font = `700 14px ${FB}`; ctx.textAlign = 'center'; ctx.fillText(text, cx, cy + 5);
}

// HUD 배치: 그리기와 탭 판정(hudHit)이 같은 좌표를 쓴다. 좁은 화면에선 구슬·스킬 칸이 함께 줄어든다
const orbR = () => Math.min(56, vw / 10);
function skillRect(i) {
  const R = orbR(), gap = 6, z = Math.min(44, (vw - 4 * R - 48 - 3 * gap) / 4), x0 = vw / 2 - (4 * z + 3 * gap) / 2;
  return { x: x0 + i * (z + gap), y: vh - HUDH + 22, z };
}
// 스킬 칸 탭 = 시전, 구슬 탭 = 물약 (마우스로 눌러도 같다)
function hudHit(x, y) {
  if (y < vh - HUDH) return null;
  const R = orbR(), cy = vh - R - 12;
  if (Math.hypot(x - (R + 16), y - cy) < R) return () => doCmd('pot', 'hp');
  if (Math.hypot(x - (vw - R - 16), y - cy) < R) return () => doCmd('pot', 'mp');
  for (let i = 0; i < 4; i++) { const r = skillRect(i); if (x >= r.x && x <= r.x + r.z && y >= r.y && y <= r.y + r.z) return () => tapCast(i); }
  return null;
}
// 조준 없이 시전: 순간이동·도약은 마지막으로 누른 곳, 나머지는 노리던 적 → 가장 가까운 보이는 적 → 바라보는 쪽
function tapCast(i) {
  const id = cls().skills[i], p = player;
  let w = world();
  if (id !== 'teleport' && id !== 'leap') {
    const t = isFoe(p.target) ? p.target : [...monsters, ...foes()].filter(visible).sort((a, b) => dist(a, p) - dist(b, p))[0];
    w = t ? { x: t.x, y: t.y } : { x: p.x + Math.cos(p.face) * 150, y: p.y + Math.sin(p.face) * 150 };
  }
  doCmd('cast', i, w);
}
function drawHUD() {
  const p = player, by = vh - HUDH, R = orbR();
  ctx.fillStyle = P.void; ctx.fillRect(0, by, vw, HUDH);
  ctx.fillStyle = P['wall-top']; ctx.fillRect(0, by, vw, 2);
  orb(R + 16, vh - R - 12, R, p.hp / mhp(), 'blood', `${Math.ceil(p.hp)}/${mhp()}`);
  orb(vw - R - 16, vh - R - 12, R, p.mp / mmp(), 'mana', `${Math.floor(p.mp)}/${mmp()}`);

  const mx = R * 2 + 40, mw = vw - mx * 2;
  ctx.fillStyle = P.floor; ctx.fillRect(mx, by + 10, mw, 5);
  ctx.fillStyle = P.gold; ctx.fillRect(mx, by + 10, mw * p.xp / p.next, 5);

  // 스킬 슬롯
  cls().skills.forEach((id, i) => {
    const s = SK[id], r = p.sk[id], { x, y, z } = skillRect(i);
    ctx.fillStyle = P['floor-2']; ctx.fillRect(x, y, z, z);
    ctx.strokeStyle = i === p.active ? P.gold : P.wall; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, z - 2, z - 2);
    ctx.globalAlpha = r ? (p.mp >= s.mp ? 1 : .45) : .3;
    ctx.fillStyle = P.ink; ctx.font = `700 12px ${FB}`; ctx.textAlign = 'center'; ctx.fillText(s.short, x + z / 2, y + 27);
    ctx.font = `400 10px ${FB}`; ctx.fillStyle = P.dim;
    ctx.textAlign = 'left'; ctx.fillText('QWER'[i], x + 4, y + 12);
    ctx.textAlign = 'right'; ctx.fillText(r ? `${r}` : `Lv${s.lv}`, x + z - 4, y + z - 5);
    ctx.fillStyle = P.mana; ctx.textAlign = 'left'; ctx.fillText(s.mp, x + 4, y + z - 5);
    ctx.globalAlpha = 1;
  });
  ctx.textAlign = 'center'; ctx.font = `400 13px ${FB}`; ctx.fillStyle = P.dim;
  ctx.fillText(vw < 640 ? `Lv ${p.lvl} · 물약 ${p.hpPot}/${p.mpPot} · 귀환 ${p.tp} · 금화 ${p.gold}`
    : `${cls().name} Lv ${p.lvl} · 1 체력 ×${p.hpPot} · 2 마나 ×${p.mpPot} · T 귀환 ×${p.tp} · I 가방 ${p.bag.length}/${BAG} · Tab 지도 · 금화 ${p.gold}`, vw / 2, by + 88);
  if (p.pts) { ctx.fillStyle = P.gold; ctx.font = `700 13px ${FB}`; ctx.fillText(`K — 스킬 포인트 ${p.pts}`, vw / 2, by - 12); }

  // 장비
  ctx.textAlign = 'left'; ctx.font = `400 13px ${FB}`;
  ctx.font = `400 12px ${FB}`;
  if (!touch) SLOTS.forEach(([k, n], i) => {   // 터치에선 이 자리에 메뉴 버튼이 온다
    const it = p.eq[k];
    ctx.fillStyle = P.dim; ctx.fillText(n, 14, 22 + i * 17);
    ctx.fillStyle = it ? P[RAR[it.rar]] : P.dim; ctx.fillText(it ? it.name : '—', 62, 22 + i * 17);
  });
  // 위치 / 퀘스트
  ctx.textAlign = 'right'; ctx.font = `700 15px ${FD}`; ctx.fillStyle = P.ink;
  ctx.fillText(floorName(floor) + (dl ? ` · ${DIFF[dl]}` : ''), vw - 14, 26);
  ctx.font = `400 12px ${FB}`; ctx.fillStyle = actDone ? P.gold : P.dim;
  ctx.fillText(actDone ? '완료 — 차원문을 통해 나아가라' : ACTS[act].quest, vw - 14, 46);
  if (net) { ctx.fillStyle = pvp ? P.blood : P.rot; ctx.fillText(`${pvp ? 'PvP' : '협동'} · 방 코드 ${net.code} · ${heroes.length}명${pvp ? ` · 내 처치 ${player.kills || 0}` : ''}${pvp && !floor ? ' · 마을은 안전 지대' : ''} · Enter 채팅`, vw - 14, 64); }

  ctx.textAlign = 'left';
  msgs.forEach((m, i) => {
    ctx.globalAlpha = Math.min(1, m.life); ctx.fillStyle = P[m.col];
    ctx.fillText(m.t, mx, by - 32 - i * 20);
  });
  ctx.globalAlpha = 1;

  // 보스 / 대상
  const boss = monsters.find(m => m.boss && m.aggro);
  const h = boss || (hover && monsters.includes(hover) ? hover : null);
  if (h) {
    const bw = boss ? Math.min(360, vw - 32) : 240, y = 58;
    ctx.textAlign = 'center'; ctx.font = `700 16px ${FD}`;
    ctx.fillStyle = P.void; ctx.fillRect(vw / 2 - bw / 2, y, bw, 30);
    ctx.fillStyle = P.blood; ctx.fillRect(vw / 2 - bw / 2, y, bw * h.hp / h.mhp, 30);
    ctx.fillStyle = h.boss ? P.unique : h.elite ? P.magic : P.ink; ctx.fillText(h.name, vw / 2, y + 21);
    if (h.mods) { ctx.font = `400 13px ${FB}`; ctx.fillStyle = P.magic; ctx.fillText(h.mods.map(k => MODN[k]).join(' · '), vw / 2, y + 48); }
  } else if (hover?.kind === 'eq') {
    ctx.textAlign = 'center'; ctx.font = `400 14px ${FB}`; ctx.fillStyle = P.ink;
    const cur = p.eq[hover.item.slot];
    ctx.fillText(`${desc(hover.item)}   ·   현재: ${cur ? desc(cur) : '없음'}`, vw / 2, 76);
  }

  if (p.dead) {
    ctx.fillStyle = P.void; ctx.globalAlpha = .7; ctx.fillRect(0, 0, vw, vh); ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.fillStyle = P.blood; ctx.font = `700 ${Math.min(64, vw / 10)}px ${FD}`;
    ctx.fillText('당신은 죽었습니다', vw / 2, vh / 2 - 10);
    ctx.fillStyle = P.dim; ctx.font = `400 16px ${FB}`;
    ctx.fillText(`클릭하여 ${net ? '입구' : '마을'}에서 부활 — 금화 절반을 잃습니다`, vw / 2, vh / 2 + 30);
  }
}

// ---------- 채팅 (멀티플레이) ----------
const chatBox = document.getElementById('chat'), chatLog = document.getElementById('chat-log'), chatIn = document.getElementById('chat-in');
const showChatBtn = () => { document.querySelector('#touch [data-a="chat"]').hidden = !net; };
function openChat() { chatBox.hidden = false; chatBox.classList.add('typing'); chatIn.hidden = false; chatIn.focus(); }
chatIn.addEventListener('blur', () => { chatBox.classList.remove('typing'); chatIn.hidden = true; });
function addChat(name, text) {
  const li = el('li'); li.append(el('b', null, name + ' '), text);   // textContent로만 — 받은 글은 HTML로 해석하지 않는다
  chatLog.append(li); chatBox.hidden = false;
  while (chatLog.children.length > 50) chatLog.firstChild.remove();
  chatLog.scrollTop = chatLog.scrollHeight;
}
// 호스트에서 실행: 말한 영웅 머리 위에 4초간 말풍선, 모두의 채팅창에 기록
function say(text) {
  text = String(text).replace(/\s+/g, ' ').trim().slice(0, 80);
  if (!text) return;
  player.say = text; player.sayT = 4;
  const name = heroName(player);
  addChat(name, text);
  for (const h of heroes) if (h._c) netSend(h._c, { t: 'chat', a: [name, text] });
}

// 터치 메뉴 버튼 → 키보드 단축키와 같은 동작
document.getElementById('touch').addEventListener('click', e => {
  const a = e.target.closest('button')?.dataset.a;
  if (!a || (paused() && a !== 'map')) return;
  if (a === 'inv') inventory();
  else if (a === 'map') showMap = !showMap;
  else if (a === 'chat') openChat();
  else doCmd(a);
  e.target.blur();
});

// ---------- 멀티플레이 (PeerJS P2P · 호스트 권한) ----------
// 호스트가 게임 전체를 돌리고 20Hz로 상태를 보낸다. 게스트는 입력 명령만 보내고 받은 상태를 그린다.
// ponytail: 매번 전체 상태를 JSON으로 보냄(수십 KB). 대역폭이 문제되면 바뀐 것만 보내기
const PEERJS = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js', ROOM = 'sanctum-room-';
const loadPeer = () => window.Peer ? Promise.resolve() : new Promise((ok, fail) => {
  const sc = document.createElement('script'); sc.src = PEERJS; sc.onload = ok; sc.onerror = () => fail(new Error('PeerJS를 불러오지 못했다'));
  document.head.append(sc);
});
// 순환 참조(대상·주인)와 캐시(_로 시작)는 빼고, 실수는 소수 둘째 자리까지. lastMove는 "몇 ms 전"으로 바꿔 보냄
// 그리는 데 안 쓰는 타이머도 뺀다. 그리는 타이머는 0 아래로 내려가면 0 — 가만히 있는 몬스터가 매번 "바뀐 것"이 되지 않게
const SKIP = new Set(['target', 'dest', 'path', 'pend', 'hit', 'owner', 'by', 'rect', 'whirlTo',
  'cd', 'spd', 'atkCd', 'repath', 'heal', 'nova', 'summon', 'lunge', 'dash', 'whirlTick']);
const TIMERS = new Set(['swing', 'flash', 'stun', 'slow', 'iced', 'cursed', 'sayT']);
function enc(o) {
  const now = performance.now();
  return JSON.stringify(o, (k, v) => k[0] === '_' || SKIP.has(k) ? undefined
    : k === 'lastMove' ? Math.min(500, Math.round(now - v)) : TIMERS.has(k) && v < 0 ? 0 : typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 100) / 100 : v);
}
const netSend = (c, o) => c?.open && c.send(enc(o));
const netFail = msg => (net?.joined && save(), openPanel('연결 끊김', msg, [['처음으로', () => location.reload()]], true));
const onJson = (conn, fn) => conn.on('data', raw => { let m; try { m = JSON.parse(raw); } catch { return; } fn(m); });

async function hostGame(state, c, isPvp) {
  startGame(state, c);
  try { await loadPeer(); } catch (e) { return log(e.message, 'blood'); }
  const code = Math.random().toString(36).slice(2, 6).toUpperCase(), peer = new Peer(ROOM + code);
  pvp = isPvp;
  setTimeout(showChatBtn);
  net = { host: true, code, peer, sfx: new Set(), bursts: [], t: 0, n: 0 };
  peer.on('open', () => log(`방 코드 ${code} — 친구에게 알려주세요`, 'gold'));
  peer.on('error', e => log('연결 오류: ' + e.type, 'blood'));
  peer.on('connection', conn => {
    onJson(conn, m => hostRecv(conn, m));
    conn.on('close', () => {
      const h = conn._h; if (!h) return;
      heroes = heroes.filter(o => o !== h); allies = allies.filter(a => a.owner !== h);
      log(`${CLASSES[h.cls].name}이(가) 떠났다`, 'dim');
    });
  });
}
function hostRecv(conn, m) {
  if (!Array.isArray(m?.a)) return;
  if (m.t === 'join' && !conn._h) {   // 게스트 캐릭터는 그쪽 저장 파일에서 온다 — 모양만 검사
    const sh = m.a[0] || {}, c = CLASSES[sh.cls] ? sh.cls : 'warrior', base = freshPlayer(c);
    const h = { ...base, ...sheet(sh), cls: c, x: player.x, y: player.y, r: 12, id: ++uid, _c: conn };
    h.eq = { ...base.eq, ...h.eq }; h.sk = { ...base.sk, ...h.sk }; if (!Array.isArray(h.bag)) h.bag = [];
    for (const k of ['lvl', 'xp', 'next', 'gold', 'hpPot', 'mpPot', 'tp', 'pts']) if (!Number.isFinite(h[k])) h[k] = base[k];
    h.hp = as(h, mhp); h.mp = as(h, mmp);
    conn._h = h; heroes.push(h);
    return log(`${CLASSES[c].name} Lv ${h.lvl}이(가) 합류했다`, 'gold', true);
  }
  if (conn._h && Object.hasOwn(CMD, m.t)) as(conn._h, () => CMD[m.t](...m.a));
}
// 목록마다 따로 인코딩해서, 그 게스트에게 지난번과 달라진 목록만 보낸다 (가만히 있는 아이템·시체·NPC는 안 보냄)
function hostTick(now) {
  if (heroes.length < 2) { net.sfx.clear(); net.bursts = []; return; }
  if (now - net.t < 50) return;
  net.t = now;
  for (const o of [...monsters, ...allies, ...items, ...objs, ...heroes]) idOf(o);
  const lists = Object.fromEntries(Object.entries({ act, floor, dl, actDone, maxFloor, pvp, heroes, allies, items, objs, shots, zones, fx, texts, corpses,
    ...(++net.n % 20 === 0 && { seen: seen.map(r => r.map(Number).join('')), decals }) }).map(([k, v]) => [k, enc(v)]));   // seen·핏자국은 1초마다
  const always = `"sfx":${enc([...net.sfx])},"bursts":${enc(net.bursts)}`;
  net.sfx.clear(); net.bursts = [];
  for (const h of heroes) {
    if (!h._c) continue;
    const last = h._last ||= {}, out = [always, `"you":${h.id}`, `"shake":${Math.round(Math.max(shake, h._shake || 0))}`];
    if (h._map !== map) {   // 새 층(또는 막 합류): 지도와 밝힌 곳 전체
      h._map = map; out.push(`"map":${enc(map.map(r => r.join('')))}`);
      lists.seen ??= enc(seen.map(r => r.map(Number).join(''))); lists.decals ??= enc(decals);
    }
    for (const k in lists) if (last[k] !== lists[k] || k === 'seen' || k === 'decals') { last[k] = lists[k]; out.push(`"${k}":${lists[k]}`); }
    const mons = enc(monsters.filter(m => dist(m, h) < 800));   // 그 게스트 주변 몬스터만
    if (last.monsters !== mons) { last.monsters = mons; out.push(`"monsters":${mons}`); }
    h._shake = 0;
    if (h._c.open) h._c.send(`{"t":"s",${out.join(',')}}`);
  }
}

async function joinGame(state, c) {
  const code = prompt('방 코드 (4자리)')?.trim().toUpperCase();
  if (!code) return title(joinGame, '방 참가');
  openPanel('연결 중…', `방 ${code}에 연결하고 있습니다.`, [['취소', () => location.reload()]], true);
  try { await loadPeer(); } catch (e) { return netFail(e.message); }
  const sh = state?.p || sheet(freshPlayer(c)), peer = new Peer();
  peer.on('error', e => netFail(e.type === 'peer-unavailable' ? `방 ${code}을(를) 찾을 수 없습니다.` : '연결 오류: ' + e.type));
  peer.on('open', () => {
    const conn = peer.connect(ROOM + code, { serialization: 'raw', reliable: true });
    net = { guest: true, code, peer, conn }; showChatBtn();
    conn.on('open', () => netSend(conn, { t: 'join', a: [sh] }));
    onJson(conn, guestRecv);
    conn.on('close', () => net.dead || (net.dead = true, netFail('호스트와 연결이 끊겼습니다.')));
  });
}
function guestRecv(m) {
  if (m.t === 'log') return log(...m.a);
  if (m.t === 'close') return closePanel();
  if (m.t === 'inv') return inventory();
  if (m.t === 'chat') return addChat(String(m.a[0]), String(m.a[1]));
  if (m.t === 'panel') { const [t, x, b, l, c] = m.a; return openPanel(t, x, b.map((o, i) => ({ ...o, fn: () => doCmd('btn', i) })), l, c); }
  if (m.t !== 's') return;
  const was = floor, now = performance.now();
  net.last = now;
  ({ act = act, floor = floor, dl = dl, actDone = actDone, maxFloor = maxFloor, pvp = pvp } = m);
  if (m.map) { map = m.map.map(r => [...r].map(Number)); setTiles(); }
  if (m.seen) seen = m.seen.map(r => [...r].map(c => c === '1'));
  if (m.decals) decals = m.decals;
  // 같은 id끼리 도트 캐시·라벨 위치를 이어받고, 위치는 목표로만 두어 guestTick에서 부드럽게 따라간다
  const keep = (old, arr) => {
    const prev = new Map(old.map(o => [o.id, o]));
    for (const o of arr) {
      if (o.lastMove != null) o.lastMove = now - o.lastMove;
      const q = prev.get(o.id); if (!q) continue;
      o._pix = q._pix; o.rect = q.rect; if (o.e) o.e._pix = q.e?._pix;
      if (dist(o, q) < 200) { o._tx = o.x; o._ty = o.y; o.x = q.x; o.y = q.y; }
    }
    return arr;
  };
  // 안 온 목록은 바뀌지 않은 것 — 그대로 둔다
  if (m.heroes) heroes = keep(heroes, m.heroes);
  if (m.monsters) monsters = keep(monsters, m.monsters);
  if (m.allies) allies = keep(allies, m.allies);
  if (m.items) items = keep(items, m.items);
  if (m.objs) objs = keep(objs, m.objs);
  if (m.corpses) corpses = keep(corpses, m.corpses);
  if (m.fx) fx = [...m.fx, ...fx.filter(f => f.local && f.t < f.dur)];
  ({ shots = shots, zones = zones, texts = texts } = m);
  player = heroes.find(h => h.id === m.you) || player;
  for (const k of m.sfx) sfx(k);
  for (const b of m.bursts) burst(...b);
  shake = Math.max(shake, m.shake);
  if (now - (net.saved || 0) > 10000) { net.saved = now; save(); }   // 호스트가 갑자기 나가도 10초 이상 잃지 않게
  if (!net.joined) { net.joined = true; closePanel(); log(`방 ${net.code}에 합류했다`, 'gold'); }
  if (floor === 0 && was !== 0) save();
}
function guestTick(dt) {
  // 호스트 창이 그냥 닫히면 WebRTC가 끊김을 알아채는 데 수십 초 걸린다 — 스냅샷이 15초 끊기면 끝난 것으로 본다 (방장이 잠깐 다른 탭에 가도 버티도록 넉넉히)
  if (net.joined && !net.dead && performance.now() - net.last > 15000) { net.dead = true; net.conn.close(); netFail('호스트의 응답이 없습니다.'); }
  const k = Math.min(1, dt * 15);
  for (const o of [...heroes, ...monsters, ...allies]) if (o._tx != null) { o.x += (o._tx - o.x) * k; o.y += (o._ty - o.y) * k; }
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  for (const f of fx) f.t += dt;
  for (const t of texts) { t.life -= dt; t.y -= 30 * dt; }
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 420 * dt; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const m of msgs) m.life -= dt;
  msgs = msgs.filter(m => m.life > 0);
  lightR = floor ? 300 + (hasFx('lamp') ? 120 : 0) : 560; dark = floor ? .9 : .5;
  reveal(player);
  hover = pickAt();
  cv.style.cursor = hover ? 'pointer' : 'crosshair';
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // 히트스톱: 치명타·처치 순간 아주 잠깐 시간을 멈춰 손맛을 줌
  if (hitstop > 0) hitstop -= dt; else if (net?.guest) guestTick(dt); else if (!botMode) update(dt);
  if (net?.host) hostTick(now);
  for (const h of heroes) h.dieT = h.dead ? (h.dieT || 0) + dt : 0;
  shake = Math.min(14, Math.max(0, shake - 40 * dt));
  cam.x = player.x - vw / 2 + rnd(-shake, shake); cam.y = player.y - (vh - HUDH) / 2 + rnd(-shake, shake);
  ctx.fillStyle = P.void; ctx.fillRect(0, 0, vw, vh);
  ctx.save(); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  drawWorld();
  ctx.restore();
  drawLight();
  drawLabels();
  drawMap();
  drawHUD();
  drawPreviews(now);
  if (!panel.hidden && panel.classList.contains('inv')) renderInv();
  requestAnimationFrame(frame);
}

enter(0);
player.hp = mhp(); player.mp = mmp(); msgs = [];
title();
requestAnimationFrame(frame);

// 밸런스 검증 봇: index.html?bot=warrior|sorc|ranger|necro|all
const BOT = new URLSearchParams(location.search).get('bot');
if (BOT) { const b = document.createElement('script'); b.src = 'bot.js'; document.body.append(b); }
</script>
